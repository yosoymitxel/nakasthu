name: Playwright QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nakasthu-playwright-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Sintaxis + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  browser:
    name: Playwright (smoke · e2e · regresión · móvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Espejo CDN (por defecto): hermético, no depende de unpkg ni de cdn.tailwindcss.com.
      - name: Suite completa
        run: npm run test:browser
      - name: Informe PASS/FAIL
        if: always()
        run: |
          node qa/support/report.mjs || true
          cat test-results/QA_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nakasthu-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  live-smoke:
    name: Smoke con CDN reales (no bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Detecta roturas reales de CDN (versiones flotantes como react@18) que el espejo oculta.
      - run: QA_CDN=live npx playwright test --config=qa/playwright.config.mjs --project=smoke
