version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ["*"]
    # El juego las sirve desde vendor/ (copia de node_modules) y el CSS de Tailwind va compilado en el repo.
    # Se suben a mano: cambiar package.json, `npm install`, `npm run build:css` y probar.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: htm
      - dependency-name: motion
      - dependency-name: three
      - dependency-name: zzfx
      - dependency-name: tailwindcss
      - dependency-name: pixelarticons
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
