<!DOCTYPE html>
<html lang="es" class="bg-[#1a1a1c]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO NAKASTHU // MANAGEMENT TERMINAL</title>
    <link rel="icon" href="data:,">
    
    <!-- Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- three.js para el fondo 3D (los modelos de polyfork.dev lo importan por este nombre) -->
    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
        "zzfx": "https://unpkg.com/zzfx@1.4.0/ZzFX.js"
    } }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/ui/styles/grid.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nakasthu: {
                            black: '#050505',
                            carbon: '#0a0a0a',
                            panel: '#111111',
                            amber: '#FF8C00',
                            cyan: '#00FFFF',
                            red: '#FF0000',
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glitch': 'glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'scanline-h': 'scanline-h 4s linear infinite',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'float': 'float 6s ease-in-out infinite',
                        'neural-scan': 'neural-scan 4s linear infinite',
                        'loading-bar': 'loading-bar 2s ease-in-out infinite',
                        'glitch-line': 'glitch-line 2s linear infinite',
                        'glitch-line-delayed': 'glitch-line 2.5s linear infinite 0.5s',
                        'scan-line': 'scan-line 4s linear infinite',
                        'vibrate-subtle': 'vibrate-subtle 0.15s linear infinite',
                        'pulse-border-critical': 'pulse-border-critical 2s ease-in-out infinite',
                        'fade-in': 'fade-in 0.5s ease-out forwards',
                        'spin-slow': 'spin 10s linear infinite',
                        'slow-spin': 'spin 15s linear infinite',
                        'ritual-glow': 'ritual-glow 4s ease-in-out infinite',
                        'whisper-flow': 'whisper-flow 8s ease-in-out infinite',
                        'float-slow': 'float 10s ease-in-out infinite',
                    },
                    keyframes: {
                        'ritual-glow': {
                            '0%, 100%': { opacity: '0.3', filter: 'blur(5px) brightness(1)' },
                            '50%': { opacity: '0.7', filter: 'blur(10px) brightness(1.5)' },
                        },
                        'whisper-flow': {
                            '0%, 100%': { transform: 'translateX(-5%) translateY(0)', opacity: '0.2' },
                            '50%': { transform: 'translateX(5%) translateY(-10px)', opacity: '0.5' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0', transform: 'scale(0.98)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        'vibrate-subtle': {
                            '0%, 100%': { transform: 'translate(0)' },
                            '25%': { transform: 'translate(-0.5px, 0.5px)' },
                            '50%': { transform: 'translate(0.5px, -0.5px)' },
                            '75%': { transform: 'translate(-0.5px, -0.5px)' },
                        },
                        'pulse-border-critical': {
                            '0%, 100%': { opacity: '0.2', borderWidth: '4px' },
                            '50%': { opacity: '0.6', borderWidth: '8px' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        'neural-scan': {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(500%)' },
                        },
                        'loading-bar': {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        },
                        'glitch-line': {
                            '0%': { transform: 'translateX(-100%)', opacity: '0' },
                            '50%': { opacity: '0.5' },
                            '100%': { transform: 'translateX(100%)', opacity: '0' },
                        },
                        'scan-line': {
                            '0%': { top: '0' },
                            '100%': { top: '100%' }
                        },
                        glitch: {
                            '0%': { transform: 'translate(0)' },
                            '20%': { transform: 'translate(-2px, 2px)' },
                            '40%': { transform: 'translate(-2px, -2px)' },
                            '60%': { transform: 'translate(2px, 2px)' },
                            '80%': { transform: 'translate(2px, -2px)' },
                            '100%': { transform: 'translate(0)' }
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        },
                        'scanline-h': {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(500%)' }
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    

    
    <style>
        :root {
            --color-bg-main: #1a1a1c; /* Gris industrial muy oscuro */
            --color-bg-panel: rgba(24, 24, 27, 0.4); /* bg-zinc-900/40 */
            --color-border: #27272a; /* zinc-800 */
            --color-text-primary: #d4d4d8; /* zinc-300 */
            --color-text-dim: #a1a1aa; /* zinc-400 */
            
            --color-black: #1a1a1c;
            --color-amber: #f59e0b;
            --color-cyan: #06b6d4;
            --color-emerald: #10b981;
        }

        * {
            font-size: 12px;
        }

        body { 
            background-color: var(--color-bg-main); 
            color: var(--color-text-primary); 
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            cursor: crosshair;
        }

        /* CRT Effects */
        .crt-overlay {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: 
                /* Scanlines - Lighter */
                linear-gradient(
                    to bottom,
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%
                ),
                /* Vignette - Lighter */
                radial-gradient(
                    circle at center,
                    transparent 60%,
                    rgba(0, 0, 0, 0.3) 100%
                );
            background-size: 100% 4px, 100% 100%;
            opacity: 0.8;
        }

        .industrial-border {
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .industrial-border::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid var(--color-amber);
            border-right: 2px solid var(--color-amber);
        }

        .text-glow-amber { text-shadow: 0 0 10px rgba(255, 140, 0, 0.5); }
        .text-glow-cyan { text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        .text-glow-red { text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }

        .clip-corner-tl {
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; border-left: 1px solid #18181b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border: 1px solid #09090b; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #09090b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        .crt-scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(255, 140, 0, 0.05);
            opacity: 0.4;
            animation: scanline 6s linear infinite;
            pointer-events: none;
            z-index: 9998;
        }

        /* Text Selection */
        ::selection {
            background: var(--color-amber);
            color: var(--color-black);
        }

        /* Text Glow Utilities */
        .text-glow-amber {
            text-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
        }
        .text-glow-cyan {
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        .text-glow-red {
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
        
        /* Industrial Border */
        .industrial-border {
            border: 1px solid #333;
            position: relative;
        }
        .industrial-border::after {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 10px; height: 10px;
            border-top: 2px solid var(--color-amber);
            border-left: 2px solid var(--color-amber);
        }
        .industrial-border::before {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 10px; height: 10px;
            border-bottom: 2px solid var(--color-amber);
            border-right: 2px solid var(--color-amber);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Motion (animaciones): expone window.Motion -->
    <script src="https://unpkg.com/motion@11.18.2/dist/motion.js"></script>
    
    <!-- App Entry Point -->
    <script type="module">
        import { html } from './src/ui/utils/html.js';
        import App from './src/ui/components/App.js';
        import './src/core/Boot.js'; // Initialize all Systems

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
