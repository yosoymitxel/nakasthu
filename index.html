        /* CRT Effects */
        .crt-overlay {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 9999;
            background: 
                /* Scanlines - Lighter */
                linear-gradient(
                    to bottom,
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%
                ),
                /* Vignette - Lighter */
                radial-gradient(
                    circle at center,
                    transparent 60%,
                    rgba(0, 0, 0, 0.3) 100%
                );
            background-size: 100% 4px, 100% 100%;
            opacity: 0.8;
        }

        .industrial-border {
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .industrial-border::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid var(--color-amber);

        .clip-corner-tl {
